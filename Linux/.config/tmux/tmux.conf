# Prefix key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Tab/window navigation
bind , previous-window
bind . next-window

# Pane resize (prefix + p + h/j/k/l)
# bind p send-prefix

# Pane swap (capital letters)
# bind H swap-pane -U
# bind J swap-pane -D
# bind K swap-pane -U
# bind L swap-pane -D

# Maximize/unmaximize
# bind > resize-pane -Z
# bind < resize-pane -Z
